name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streaming:
    name: Live sharing service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test streaming/server.test.mjs
      - run: node --check streaming/public/viewer.js
      - run: npm ci --prefix streaming
      - run: npx --prefix streaming playwright install --with-deps chromium
      - run: node streaming/browser-smoke.cjs

  validate:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install JDK 17 compiler toolchain
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Gradle runtime
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Gradle runtime
        run: ./gradlew --version

      - name: Test, lint, and assemble
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports-jdk-${{ matrix.java }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk-jdk-${{ matrix.java }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
